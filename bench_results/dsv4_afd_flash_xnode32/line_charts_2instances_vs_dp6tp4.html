<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>2×单机实例 vs 双机 DP6TP4 vs 双机 baseline（2026-09-04）</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { font: 13px/1.45 -apple-system, "Segoe UI", sans-serif; margin: 18px;
         background: #fafafa; color: #111; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: #555; font-size: 12px; margin-bottom: 14px; }
  .panel { background: #fff; border: 1px solid #ddd; border-radius: 8px;
           padding: 14px 16px 10px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; margin: 0 0 8px; }
  .chartbox { position: relative; height: 340px; }
</style>
</head>
<body>
<h1>实例级扩展对比（formal_1,32 卡总预算）：2×单机 AFD 实例 vs 双机 DP6TP4 vs 双机 baseline</h1>
<div class="sub">async-sched ON，CWS，util 0.80。颜色 = 部署形态
（<b style="color:#0072B2">蓝 = DP4TP2+EP8 单机实例</b> /
<b style="color:#B7791F">橙 = DP6TP4+EP8 双机单实例</b> /
<b style="color:#1e7d64">绿 = 2×DP4TP4EP16 baseline</b>），
线型 = 配置（实线/虚线见 图例）。横轴为供给速率（tok/s）。
1×实例参考线无 2x 格（该配置 1.5x 已饱和）。router 分流实测 766:772。</div>
<div id="charts"></div>
<script>
const P = {"offered":[35071,52606,70142],"labels":["1x","1.5x","2x"],"series":{"inst2_tok":[{"p50":1.921101987361908,"p99":8.366073603704564,"eff":33547.01474708481,"peak":55009.333333333336,"slo10":99.609375},{"p50":2.786485444754362,"p99":10.520203415751453,"eff":49095.453703601735,"peak":67890.66666666667,"slo10":98.6328125},{"p50":4.172547064721584,"p99":13.181462789624916,"eff":62993.183205868205,"peak":78714.33333333333,"slo10":91.9921875}],"inst1_tok":[{"p50":4.647047616541386,"p99":15.571272809319199,"eff":32829.56406539334,"peak":44740.8,"slo10":85.15625},{"p50":16.41318510659039,"p99":34.315083190314475,"eff":40095.72124007878,"peak":46606.933333333334,"slo10":35.9375},null],"dp6tp4_token":[{"p50":3.1656404118984938,"p99":8.052789277248085,"eff":33649.7082463143,"peak":53215.2,"slo10":99.609375},{"p50":3.9753409400582314,"p99":10.639605565704406,"eff":48941.29904727476,"peak":61176.46666666667,"slo10":98.4375},{"p50":6.309537019580603,"p99":14.27065824802965,"eff":61629.46086492417,"peak":74870.13333333333,"slo10":87.109375}],"dp6tp4_request":[{"p50":2.449292492121458,"p99":8.211810986697675,"eff":33795.574288861695,"peak":54025.666666666664,"slo10":99.8046875},{"p50":3.3462526611983776,"p99":11.955585633888841,"eff":49516.25249762192,"peak":63204.73333333333,"slo10":95.3125},{"p50":6.774983990937471,"p99":13.94705188460648,"eff":58867.86285374145,"peak":75421.66666666667,"slo10":82.03125}],"base2x_8k":[{"p50":2.694009944796562,"p99":10.207511299625036,"eff":32873.530491159574,"peak":51597.13333333333,"slo10":98.6328125},{"p50":4.17313826084137,"p99":13.521854548044496,"eff":47061.855391742945,"peak":59888.86666666667,"slo10":92.3828125},{"p50":5.9652195777744055,"p99":16.15589347306639,"eff":57703.36149787815,"peak":72518.06666666667,"slo10":79.1015625}],"base2x_32k":[{"p50":9.920005178079009,"p99":19.41664099916816,"eff":31380.76420291574,"peak":51251.2,"slo10":51.953125},{"p50":11.478576257824898,"p99":25.05064969867468,"eff":41525.496174640764,"peak":6 const KEYS = ["inst2_tok", "inst1_tok", "dp6tp4_token", "dp6tp4_request", "base2x_8k", "base2x_32k"];
const CHARTS = [
  { id: "p50",  title: "TTFT p50（s）",             unit: "s",    yfmt: v => v.toFixed(1) },
  { id: "p99",  title: "TTFT p99（s）",             unit: "s",    yfmt: v => v.toFixed(0) },
  { id: "eff",  title: "有效吞吐（tok/s）",          unit: "tok/s", yfmt: v => (v/1000).toFixed(0) + "K" },
  { id: "peak", title: "峰值 15s 服务速率（tok/s）",  unit: "tok/s", yfmt: v => (v/1000).toFixed(0) + "K" },
  { id: "slo10",title: "10s TTFT SLO 达成率（%）",    unit: "%",    yfmt: v => v.toFixed(0) },
];
const wrap = document.getElementById("charts");
for (const c of CHARTS) {
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `<h2>${c.title}</h2><div class="chartbox"><canvas id="cv_${c.id}"></canvas></div>`;
  wrap.appendChild(panel);
  new Chart(document.getElementById(`cv_${c.id}`), {
    type: "line",
    data: {
      labels: P.offered,
      datasets: KEYS.map(k => ({
        label: P.labels_map[k],
        data: P.series[k].map(m => m ? m[c.id] : null),
        borderColor: P.colors[P.family[k]],
        backgroundColor: P.colors[P.family[k]],
        borderDash: P.dash[k],
        borderWidth: 2,
        pointRadius: 4,
        pointHoverRadius: 6,
        tension: 0.15,
        spanGaps: false,
      })),
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "nearest", intersect: false },
      scales: {
        x: {
          title: { display: true, text: "供给速率（tok/s）" },
          ticks: { callback: function(v, i) { return P.labels[i] + "\n" + (P.offered[i]/1000) + "K"; } },
          grid: { color: "#eee" },
        },
        y: { title: { display: true, text: c.unit }, grid: { color: "#eee" } },
      },
      plugins: {
        legend: { position: "top", labels: { usePointStyle: true, pointStyle: "line", font: { size: 11 } } },
        tooltip: {
          callbacks: {
            title: items => `供给 ${P.labels[items[0].dataIndex]}（${P.offered[items[0].dataIndex].toLocaleString()} tok/s）`,
            label: item => (item.parsed.y == null ? null : ` ${item.dataset.label}: ${c.yfmt(item.parsed.y)} ${c.unit}`),
          },
        },
      },
    },
  });
}
</script>
</body>
</html>
